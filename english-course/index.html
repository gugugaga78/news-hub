const SKEY = "english-course-progress-v1";
let prog = JSON.parse(localStorage.getItem(SKEY) || "{}");
let cur = DAYS[DAYS.length - 1].id;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function cardHtml(w, di, wi){
  const cls = w.tag === "AI" ? "ai" : "ielts";
  const checked = (prog[di] && prog[di]["w" + wi]) ? " done" : "";
  return `<div class="card" onclick="flip(this)">
    <div class="inner">
      <div class="face front">
        <span class="tag ${cls}">${esc(w.tag)}</span>
        <div class="word">${esc(w.word)}</div>
        <div class="ipa">${esc(w.ipa)}</div>
        <div class="tip">点击翻面</div>
      </div>
      <div class="face back">
        <div class="pos">${esc(w.pos)}</div>
        <div class="def">${esc(w.def)}</div>
        <div class="ex">${esc(w.ex)}</div>
      </div>
    </div>
  </div>`;
}

function flip(el){el.classList.toggle("flip");}

function toggleTask(di, ti){
  prog[di] = prog[di] || {};
  prog[di]["t" + ti] = !prog[di]["t" + ti];
  localStorage.setItem(SKEY, JSON.stringify(prog));
  render();
}

function taskHtml(d, di){
  let done = 0;
  const items = d.tasks.map(function(t, ti){
    const on = prog[di] && prog[di]["t" + ti];
    if (on) done++;
    return `<label class="chk${on ? " done" : ""}">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleTask('${di}',${ti})">
      <span>${esc(t)}</span></label>`;
  }).join("");
  const pct = Math.round(done / d.tasks.length * 100);
  return items + `<div class="prog"><div style="width:${pct}%"></div></div>
    <div class="progtxt">今日完成度 ${done}/${d.tasks.length}（${pct}%）</div>`;
}

function render(){
  const d = DAYS.filter(function(x){return x.id === cur;})[0];
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.toggle("on", t.dataset.id === cur);
  });
  const el = document.getElementById("day");
  el.innerHTML = `
    <div class="daymeta"><b>${esc(d.title)}</b><br>${esc(d.sub)}</div>
    <h2>① 词汇 25 词 <span class="cnt">20 min · 12 专业词 + 13 雅思高阶词</span></h2>
    <div class="hint">读法：先只看正面回忆意思 → 点击翻面核对。第二遍遮住英文、看中文回忆拼写。</div>
    <div class="grid">${d.words.map(function(w,i){return cardHtml(w,d.id,i);}).join("")}</div>
    <h2>② ${esc(d.oralTitle)}</h2>
    ${d.oral}
    <h2>③ 词串小作文 <span class="cnt">5 min</span></h2>
    <div class="box">
      <h3>用下面的词串，写 3–5 句连贯的英文</h3>
      <div class="words-in">${d.writing.words.map(function(w){return "<span>" + esc(w) + "</span>";}).join("")}</div>
      <p style="font-size:13.5px;color:#cbd5e1">${esc(d.writing.task)}</p>
    </div>
    <h2>④ 今日打卡</h2>
    <div class="box">${taskHtml(d, d.id)}</div>
    <div class="box"><h3>💡 提示</h3>
      <p style="font-size:13.5px;color:#cbd5e1">${esc(d.note)}</p></div>`;
}

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){ cur = this.dataset.id; render(); });
});
render();
</script>
