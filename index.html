<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub — 你的专属新闻聚合器</title>
    <style>
        /* ============================================================
           GLOBAL RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: 18px;

            --accent-ai:     #00e5ff;
            --accent-mil:    #76ff03;
            --accent-fin:    #ffd740;
            --accent-pol:    #ff6e40;

            --text-primary:  #e8eaed;
            --text-secondary:#9aa0a6;
            --text-muted:    #5f6368;

            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 30%, #0d1117 60%, #1a1f35 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient background blobs */
        body::before {
            content: "";
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: "";
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 110, 64, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            padding: 48px 0 32px;
        }
        .header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e8eaed 0%, #bdc1c6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ── Tab Bar ── */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 26px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            user-select: none;
        }
        .tab-btn:hover {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-1px);
        }
        .tab-btn.active {
            border-color: rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.14);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        /* ── Count badge ── */
        .count-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            vertical-align: middle;
        }

        /* ── Card Grid ── */
        .card-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: 1fr;
        }
        @media (min-width: 700px) {
            .card-grid { grid-template-columns: 1fr 1fr; }
        }

        /* ── Glass Card ── */
        .card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 18px 20px;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow: var(--glass-shadow);
        }

        /* ── Category accent dot ── */
        .card-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 7px;
            flex-shrink: 0;
        }
        .card-dot.ai   { background: var(--accent-ai);  box-shadow: 0 0 8px var(--accent-ai); }
        .card-dot.mil  { background: var(--accent-mil); box-shadow: 0 0 8px var(--accent-mil); }
        .card-dot.fin  { background: var(--accent-fin); box-shadow: 0 0 8px var(--accent-fin); }
        .card-dot.pol  { background: var(--accent-pol); box-shadow: 0 0 8px var(--accent-pol); }
        .card-dot.learn{ background: #b388ff; box-shadow: 0 0 8px #b388ff; }

        /* ── Card title ── */
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-title a {
            color: inherit;
            text-decoration: none;
        }
        .card-title a:hover { text-decoration: underline; }

        /* ── Card meta ── */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .card-source {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            font-weight: 500;
        }

        /* ── Tooltip (summary popup on hover) ── */
        .card-tooltip {
            position: absolute;
            left: 0; right: 0;
            bottom: calc(100% + 10px);
            background: rgba(20, 25, 35, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.55;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition: opacity 0.22s, visibility 0.22s, transform 0.22s;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .card-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 24px;
            border: 8px solid transparent;
            border-top-color: rgba(20, 25, 35, 0.96);
        }
        .card:hover .card-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* ── Empty state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.95rem; }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 44px;
            padding: 18px;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer .update-time {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ── Loading shimmer ── */
        .shimmer {
            animation: shimmer 1.6s infinite;
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
            .tab-btn { padding: 8px 16px; font-size: 0.82rem; }
            .card { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ========== Header ========== -->
    <header class="header">
        <h1>&#x1f4f0; NewsHub</h1>
        <p class="subtitle">AI &middot; 军事 &middot; 金融 &middot; 时政 实时聚合</p>
    </header>

    <!-- ========== Tab Bar ========== -->
    <nav class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-cat="all">全部 <span class="count-badge" id="cntAll">--</span></button>
        <button class="tab-btn" data-cat="AI">&#x1f916; AI <span class="count-badge" id="cntAI">--</span></button>
        <button class="tab-btn" data-cat="军事">&#x1f6e1; 军事 <span class="count-badge" id="cntMil">--</span></button>
        <button class="tab-btn" data-cat="金融">&#x1f4b0; 金融 <span class="count-badge" id="cntFin">--</span></button>
        <button class="tab-btn" data-cat="时政">&#x1f30d; 时政 <span class="count-badge" id="cntPol">--</span></button>
        <button class="tab-btn" data-cat="learn">&#x1f4da; AI学习 <span class="count-badge" id="cntLearn">--</span></button>
    </nav>

    <!-- ========== Card Grid ========== -->
    <div class="card-grid" id="cardGrid">
        <!-- Loading skeleton -->
        <div class="card shimmer" style="height:80px;"></div>
        <div class="card shimmer" style="height:80px;"></div>
        <div class="card shimmer" style="height:80px;"></div>
        <div class="card shimmer" style="height:80px;"></div>
    </div>

    <!-- ========== Footer ========== -->
    <footer class="footer">
        最后更新时间：<span class="update-time" id="updateTime">加载中...</span>
    </footer>
</div>

<!-- ================================================================
     SCRIPT
     ================================================================ -->
<script>
(function() {

const GRID = document.getElementById("cardGrid");
const UPDATE_TIME = document.getElementById("updateTime");

let allArticles = [];
let aiResources = [];
let activeCategory = "all";

// ── Category helpers ──
const CAT_MAP = {
    "AI":   { cls: "ai",  label: "AI" },
    "军事": { cls: "mil", label: "军事" },
    "金融": { cls: "fin", label: "金融" },
    "时政": { cls: "pol", label: "时政" },
    "learn":{ cls: "learn", label: "AI学习" },
};

function getCatClass(cat) {
    return (CAT_MAP[cat] && CAT_MAP[cat].cls) || "";
}

// ── Load data ──
async function loadData() {
    try {
        const res = await fetch("news_data.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allArticles = data.articles || [];
        UPDATE_TIME.textContent = data.last_updated || "--";
    } catch (err) {
        console.error("加载新闻数据失败:", err);
        GRID.innerHTML = `<div class="empty-state">
            <div class="icon">&#x1f6a7;</div>
            <p>数据加载失败，请稍后刷新页面。</p>
            <p style="font-size:0.8rem;margin-top:6px;">${err.message}</p>
        </div>`;
        return;
    }

    // 加载 AI 学习资源（可选，失败不阻塞新闻展示）
    try {
        const res2 = await fetch("ai_resources.json");
        if (res2.ok) {
            const data2 = await res2.json();
            aiResources = data2.resources || [];
        }
    } catch (err2) {
        console.error("加载 AI 学习资源失败:", err2);
    }

    updateCounts();
    renderArticles();
}

// ── Update tab counts ──
function updateCounts() {
    const counts = { all: allArticles.length, AI: 0, "军事": 0, "金融": 0, "时政": 0 };
    allArticles.forEach(a => {
        if (counts[a.category] !== undefined) counts[a.category]++;
    });
    document.getElementById("cntAll").textContent = counts.all;
    document.getElementById("cntAI").textContent  = counts.AI;
    document.getElementById("cntMil").textContent = counts["军事"];
    document.getElementById("cntFin").textContent = counts["金融"];
    document.getElementById("cntPol").textContent = counts["时政"];
    document.getElementById("cntLearn").textContent = aiResources.length;
}

// ── Format date ──
function formatDate(iso) {
    try {
        const d = new Date(iso);
        const now = new Date();
        const diff = now - d;
        if (diff < 3600000) return `${Math.floor(diff/60000)} 分钟前`;
        if (diff < 86400000) return `${Math.floor(diff/3600000)} 小时前`;
        return d.toLocaleDateString("zh-CN", { month:"short", day:"numeric" });
    } catch { return ""; }
}

// ── Render cards ──
function renderArticles() {
    if (activeCategory === "learn") {
        renderLearnCards();
        return;
    }

    let articles = allArticles;
    if (activeCategory !== "all") {
        articles = articles.filter(a => a.category === activeCategory);
    }

    if (articles.length === 0) {
        GRID.innerHTML = `<div class="empty-state">
            <div class="icon">&#x1f4ed;</div>
            <p>暂无文章</p>
        </div>`;
        return;
    }

    GRID.innerHTML = articles.map(a => {
        const catCls = getCatClass(a.category);
        const timeStr = formatDate(a.published);
        // 优先使用中文翻译
        const title = a.title_cn || a.title;
        const summary = a.summary_cn || a.summary || "(暂无摘要)";
        // 如果有中文翻译，工具提示同时显示中英文
        const origSummary = (a.summary_cn && a.summary) 
            ? `<div style="color:#9aa0a6;margin-bottom:4px;">${escapeHtml(a.summary_cn)}</div><div style="font-size:0.78rem;color:#5f6368;">原文: ${escapeHtml(a.summary)}</div>`
            : escapeHtml(summary);
        return `
        <div class="card" onclick="window.open('${escapeHtml(a.link)}', '_blank', 'noopener')">
            <div class="card-tooltip">${origSummary}</div>
            <div class="card-title">
                <span class="card-dot ${catCls}"></span>
                ${escapeHtml(title)}
            </div>
            <div class="card-meta">
                <span class="card-source">${escapeHtml(a.source)}</span>
                <span>${timeStr}</span>
            </div>
        </div>`;
    }).join("");
}

// ── Render AI learning resource cards ──
function renderLearnCards() {
    if (aiResources.length === 0) {
        GRID.innerHTML = `<div class="empty-state">
            <div class="icon">&#x1f4da;</div>
            <p>AI 学习资源暂无数据，等待自动采集～</p>
        </div>`;
        return;
    }
    GRID.innerHTML = aiResources.map(r => {
        const stars = r.stars ? `<span>&#x2b50; ${r.stars}</span>` : "";
        const linkAttr = r.link ? `onclick="window.open('${escapeHtml(r.link)}','_blank','noopener')"` : "";
        return `
        <div class="card" ${linkAttr}>
            <div class="card-tooltip">${escapeHtml(r.summary || "")}</div>
            <div class="card-title">
                <span class="card-dot learn"></span>
                ${escapeHtml(r.title)}
            </div>
            <div class="card-meta">
                <span class="card-source">${escapeHtml(r.source || "")}</span>
                <span>${escapeHtml(r.type || "")}</span>
                ${stars}
            </div>
        </div>`;
    }).join("");
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
}

// ── Tab switching ──
document.getElementById("tabBar").addEventListener("click", e => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;

    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    activeCategory = btn.dataset.cat;
    renderArticles();
});

// ── Keyboard navigation ──
document.addEventListener("keydown", e => {
    const cats = ["all", "AI", "军事", "金融", "时政", "learn"];
    const idx = cats.indexOf(activeCategory);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        const newIdx = e.key === "ArrowRight"
            ? (idx + 1) % cats.length
            : (idx - 1 + cats.length) % cats.length;
        document.querySelector(`[data-cat="${cats[newIdx]}"]`).click();
    }
});

// ── Bootstrap ──
loadData();

})();
</script>

</body>
</html>
